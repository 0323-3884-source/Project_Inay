<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ec0a78">
    <title>Project INAY Offline</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #12213c;
            background: #f8fafc;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(440px, 100%);
            padding: 28px;
            background: #ffffff;
            border: 1px solid #e3eaf3;
            border-radius: 8px;
            box-shadow: 0 18px 46px rgba(15, 23, 42, 0.08);
        }

        .mark {
            display: inline-grid;
            width: 52px;
            height: 52px;
            place-items: center;
            color: #ec0a78;
            background: #fff0f8;
            border: 1px solid #ffd4e7;
            border-radius: 8px;
        }

        h1 {
            margin: 18px 0 8px;
            color: #071127;
            font-size: 24px;
            line-height: 1.15;
        }

        p {
            margin: 0;
            color: #52627d;
            line-height: 1.55;
        }
    </style>
</head>
<body>
    <main>
        <span class="mark" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20.8 5.6a5.4 5.4 0 0 0-7.6 0L12 6.8l-1.2-1.2a5.4 5.4 0 1 0-7.6 7.6l1.2 1.2L12 22l7.6-7.6 1.2-1.2a5.4 5.4 0 0 0 0-7.6Z"/>
            </svg>
        </span>
        <h1>Project INAY is offline</h1>
        <p>This page has not been saved on this device yet. Open the app while connected and wait for offline preparation to finish. Previously saved pages are still available.</p>
        <p style="margin-top:16px"><a href="./">Open saved dashboard</a></p>
    </main>
</body>
</html>
